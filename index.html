<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>WebGIS - Painel Interativo Numero 1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        #sidebar { position: absolute; top: 20px; left: 20px; width: 320px; background: rgba(255, 255, 255, 0.95); padding: 20px; z-index: 1000; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h2 { margin-top: 0; font-size: 18px; color: #333; border-bottom: 2px solid #0078A8; padding-bottom: 10px; }
        .search-container { display: flex; gap: 5px; margin-bottom: 20px; }
        #search-box { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        #search-btn { padding: 8px 12px; background: #0078A8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .layer-group { margin-bottom: 15px; }
        .layer-group strong { display: block; font-size: 13px; color: #555; margin-bottom: 8px; }
        .layer-item { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 5px; }
        .legend-color { width: 14px; height: 14px; border: 1px solid #999; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Painel do Projeto Modelo</h2>
        <div class="search-container">
            <input type="text" id="search-box" placeholder="Código da Fazenda (ex: 1003)">
            <button id="search-btn">Buscar</button>
        </div>

        <div class="layer-group">
            <strong>LIMITES DO PROJETO ANALISADO</strong>
            <label class="layer-item"><input type="checkbox" id="check-aid" checked> <div class="legend-color" style="background: rgba(255,0,0,0.2); border-color: red;"></div> Área de Influência Direta (AID)</label>
            <label class="layer-item"><input type="checkbox" id="check-ada" checked> <div class="legend-color" style="background: rgba(0,0,255,0.4); border-color: blue;"></div> Área Diretamente Afetada (ADA)</label>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicialização do mapa
        var map = L.map('map', { zoomControl: false }).setView([-21.225, -43.767], 10);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // ==========================================
        // 1. CONTROLE DE ORDEM DAS CAMADAS (Z-INDEX)
        // ==========================================
        // Criamos "painéis". O painel com zIndex maior fica por cima.
        map.createPane('pane_aid');
        map.getPane('pane_aid').style.zIndex = 400; // Fica por baixo

        map.createPane('pane_ada');
        map.getPane('pane_ada').style.zIndex = 410; // Fica por cima (Fazendas)

        var camadaAID = L.layerGroup().addTo(map);
        var camadaADA = L.layerGroup().addTo(map);

        // Variável global para armazenar os dados das fazendas e permitir a busca
        var camadaGeoJsonFazendas;

        // ==========================================
        // 2. CARREGAMENTO DOS DADOS (GEOJSON)
        // ==========================================
        // Carrega Área de Influência Direta (AID)
        fetch('dados/influencia.geojson')
            .then(res => res.json())
            .then(data => {
                var influenciaLayer = L.geoJSON(data, {
                    pane: 'pane_aid', // Associa ao painel inferior
                    style: { color: 'red', weight: 2, fillOpacity: 0.1 }
                }).addTo(camadaAID);
                
                // Dá o zoom automático para enquadrar a AID ao abrir o mapa
                map.fitBounds(influenciaLayer.getBounds());
            })
            .catch(err => console.error("Erro ao carregar Área de Influência:", err));

        // Carrega Área Diretamente Afetada (ADA - Fazendas)
        fetch('dados/fazendas.geojson')
            .then(res => res.json())
            .then(data => {
                camadaGeoJsonFazendas = L.geoJSON(data, {
                    pane: 'pane_ada', // Associa ao painel superior
                    style: { color: 'blue', weight: 2, fillOpacity: 0.4 },
                    onEachFeature: function (feature, layer) {
                        let codFazenda = feature.properties.FAZENDA || "Sem código"; 
                        layer.bindPopup("<b>Fazenda</b><br>Código: " + codFazenda);
                    }
                }).addTo(camadaADA);
            })
            .catch(err => console.error("Erro ao carregar Fazendas:", err));

        // ==========================================
        // 3. LÓGICA DA BARRA DE PESQUISA
        // ==========================================
        document.getElementById('search-btn').addEventListener('click', function() {
            var inputValor = document.getElementById('search-box').value.trim();
            
            if (inputValor === "") {
                alert("Digite o código da fazenda!");
                return;
            }

            var encontrou = false;

            // Percorre todas as fazendas dentro da camada carregada
            camadaGeoJsonFazendas.eachLayer(function(layer) {
                // Pega o valor da coluna FAZENDA. Transformamos tudo em texto (String)
                // para evitar erros caso você digite "1003" e no arquivo esteja como número 1003.
                var fazendaAtual = String(layer.feature.properties.FAZENDA);
                
                if (fazendaAtual === inputValor) {
                    // Se encontrou, dá o zoom com uma margem (padding) e abre o balão
                    map.fitBounds(layer.getBounds(), { padding: [50, 50], maxZoom: 16 });
                    layer.openPopup();
                    encontrou = true;
                }
            });

            // Se rodou tudo e não achou, avisa o usuário
            if (!encontrou) {
                alert("Fazenda " + inputValor + " não encontrada no banco de dados.");
            }
        });

        // ==========================================
        // 4. LÓGICA DE LIGAR/DESLIGAR NO MENU
        // ==========================================
        document.getElementById('check-aid').addEventListener('change', function() {
            if(this.checked) map.addLayer(camadaAID); else map.removeLayer(camadaAID);
        });

        document.getElementById('check-ada').addEventListener('change', function() {
            if(this.checked) map.addLayer(camadaADA); else map.removeLayer(camadaADA);
        });
    </script>
</body>
</html>
